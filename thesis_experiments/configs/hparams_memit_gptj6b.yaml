# EasyEdit MEMIT hyperparameters (consumed by load_hparams)
# Keep ALL MEMIT-related settings here (mom2, layers, stats_dir, device, etc.)

alg_name: "MEMIT"
model_name: "EleutherAI/gpt-j-6b"

# MEMIT regularization / misc
v_weight_decay: 0.5
kl_factor: 0.0625
mom2_adjustment: true

# Second-moment (mom2) stats settings
mom2_dataset: "wikipedia"
mom2_n_samples: 10000
mom2_dtype: "float32"

layer_selection: "all"
mom2_update_weight: 15000

# Core MEMIT parameters (GPT-J)
layers: [3, 4, 5, 6, 7, 8]
fact_token: "subject_last"

v_num_grad_steps: 25
v_lr: 5e-1
v_loss_layer: 27
clamp_norm_factor: 0.75

# Module templates (GPT-J)
rewrite_module_tmp: "transformer.h.{}.mlp.fc_out"
layer_module_tmp: "transformer.h.{}"
mlp_module_tmp: "transformer.h.{}.mlp"
attn_module_tmp: "transformer.h.{}.attn"

ln_f_module: "transformer.ln_f"
lm_head_module: "lm_head"

# Runtime
stats_dir: "thesis_experiments/stats"
device: 0
model_parallel: true
fp16: false